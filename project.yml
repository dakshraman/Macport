name: Macport
options:
  bundleIdPrefix: com.dakshraman
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_STRICT_CONCURRENCY: complete
  DEAD_CODE_STRIPPING: YES

targets:
  # Shared library: the VM model, the bundle format and the engine protocol.
  # Both the app and the CLI link this, so a VM started from the command line is
  # the same machine the UI sees — not a re-implementation that can drift.
  MacportKit:
    type: framework
    platform: macOS
    sources:
      - path: MacportKit
    # A framework target needs its own Info.plist or the app cannot embed it.
    # Kept outside the sources directory so it is never treated as a resource.
    info:
      path: Support/MacportKit-Info.plist
      properties:
        CFBundleName: MacportKit
        CFBundleDisplayName: MacportKit
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dakshraman.macportkit
      PRODUCT_NAME: MacportKit
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CODE_SIGN_STYLE: Automatic
      DEFINES_MODULE: YES
      SKIP_INSTALL: YES
      # Static, not dynamic. MacportKit is the shared model and engine protocol;
      # a CLI tool has nowhere to embed a dylib, and neither binary benefits from
      # loading core model code at runtime.
      MACH_O_TYPE: staticlib

  Macport:
    type: application
    platform: macOS
    sources:
      - path: Macport/App
      - path: Macport/Views
      - path: Macport/Resources
    dependencies:
      - target: MacportKit
        embed: false
      # Built before the app so its executable exists for the copy phase below.
      # It is a process, not a linked library: the app talks to it over the
      # control socket, never by calling into it.
      - target: MacportVMHost
        embed: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dakshraman.macport
      PRODUCT_NAME: Macport
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      INFOPLIST_FILE: Macport/Resources/Info.plist
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Macport/Resources/Macport.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      # Sandbox is deliberately off in v1 — see Macport.entitlements for why and
      # what must happen before release.
      ENABLE_APP_SANDBOX: NO
      # The runtime-embedding script writes into the app bundle. Script
      # sandboxing would block that without declaring every input; it is a
      # build-time copy of a known directory, so leave it unsandboxed.
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Embed QEMU runtime
        # The script compares source and destination before copying and exits 0
        # when nothing changed, so Xcode's dependency analysis has nothing to
        # save us from — and no outputs to declare.
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/vendor-runtime.sh" \
            "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
      - name: Embed MacportVMHost
        # The host is the app's only way to keep a QEMU guest alive after quit.
        # Missing it silently downgrades to in-process QEMU, which looks like a
        # working machine until the window closes — so a failed copy fails the
        # build instead.
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/embed-vm-host.sh" \
            "${BUILT_PRODUCTS_DIR}/MacportVMHost" \
            "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/MacOS" \
            "${SRCROOT}/MacportVMHost/MacportVMHost.entitlements"

  MacportCtl:
    type: tool
    platform: macOS
    sources:
      - path: MacportCtl
    dependencies:
      - target: MacportKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dakshraman.macportctl
      PRODUCT_NAME: macportctl
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: MacportCtl/MacportCtl.entitlements

  # One process per QEMU machine. It owns the QEMU child, the QMP connection and
  # the control socket, which is what lets a guest outlive the app.
  MacportVMHost:
    type: tool
    platform: macOS
    sources:
      - path: MacportVMHost
    dependencies:
      - target: MacportKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dakshraman.macportvmhost
      PRODUCT_NAME: MacportVMHost
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: MacportVMHost/MacportVMHost.entitlements

  # Pure-logic tests for the shared model and engine routing. No guest boots,
  # no window opens and no QEMU runtime is required; engine-specific tests live
  # beside the workstream that implements them.
  MacportKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacportKitTests
    dependencies:
      - target: MacportKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dakshraman.macportkittests
      PRODUCT_NAME: MacportKitTests
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic

schemes:
  Macport:
    build:
      targets:
        Macport: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MacportKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MacportCtl:
    build:
      targets:
        MacportCtl: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MacportVMHost:
    build:
      targets:
        MacportVMHost: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

